<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <title>Wardrobe</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/Wardrobe/wardrobe-apple-touch-icon-v2.png" />
    <style>html,body{margin:0;background:#0B0B0C}</style>
    <script>
      // GitHub Pages has no native SPA fallback. Preserve the requested route
      // in the query string, then app/+html.tsx restores it before React mounts.
      (function () {
        var pathSegmentsToKeep = 1;
        var location = window.location;
        location.replace(
          location.protocol + '//' + location.hostname +
          (location.port ? ':' + location.port : '') +
          location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash
        );
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wardrobe">
  <link rel="manifest" href="/Wardrobe/manifest.webmanifest">
</head>
  <body></body>
</html>
